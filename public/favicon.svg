<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Geometric bear from new JANIBEAR logo - yellow & white, favicon size -->
  <defs>
    <linearGradient id="bear-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>
  <!-- Left ear -->
  <polygon points="4,6 12,9 10,16 4,14" fill="url(#bear-grad)" stroke="#fcd34d" stroke-width="0.8"/>
  <!-- Right ear -->
  <polygon points="28,6 20,9 22,16 28,14" fill="url(#bear-grad)" stroke="#fcd34d" stroke-width="0.8"/>
  <!-- Main head (hexagon) -->
  <polygon points="16,2 30,10 28,24 16,30 4,24 2,10" fill="url(#bear-grad)" stroke="#fcd34d" stroke-width="0.8"/>
  <!-- Snout (lighter) -->
  <polygon points="12,14 20,14 18,22 16,26 14,22" fill="#fef3c7" stroke="#fbbf24" stroke-width="0.6"/>
  <!-- Nose -->
  <polygon points="14,17 18,17 16,20" fill="#92400e"/>
  <!-- Eye accents -->
  <polygon points="8,12 10,14 8,16 6,14" fill="#fef3c7"/>
  <polygon points="22,12 24,14 22,16 20,14" fill="#fef3c7"/>
</svg>
