<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="50%" stop-color="#fcd34d"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="snout" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>
  <!-- Head (round bear face) -->
  <circle cx="16" cy="17" r="12" fill="url(#bg)" stroke="#b45309" stroke-width="0.8"/>
  <!-- Left ear -->
  <circle cx="9" cy="10" r="4" fill="url(#bg)" stroke="#b45309" stroke-width="0.6"/>
  <!-- Right ear -->
  <circle cx="23" cy="10" r="4" fill="url(#bg)" stroke="#b45309" stroke-width="0.6"/>
  <!-- Snout (oval) -->
  <ellipse cx="16" cy="20" rx="5" ry="4" fill="url(#snout)" stroke="#92400e" stroke-width="0.5"/>
  <!-- Nose -->
  <ellipse cx="16" cy="19" rx="2" ry="1.5" fill="#78350f"/>
  <!-- Left eye -->
  <ellipse cx="12" cy="15" rx="1.5" ry="1.2" fill="#1f2937"/>
  <!-- Right eye -->
  <ellipse cx="20" cy="15" rx="1.5" ry="1.2" fill="#1f2937"/>
</svg>
