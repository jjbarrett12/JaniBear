<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Bear head from JaniBear logo - geometric low-poly, simplified for favicon -->
  <defs>
    <linearGradient id="head" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6C7B8E"/>
      <stop offset="50%" style="stop-color:#4C5C6F"/>
      <stop offset="100%" style="stop-color:#3F4D5C"/>
    </linearGradient>
  </defs>
  <!-- Left ear -->
  <polygon points="16,20 34,26 26,44 12,38" fill="url(#head)" stroke="#2B353E" stroke-width="2"/>
  <!-- Right ear -->
  <polygon points="84,20 66,26 74,44 88,38" fill="url(#head)" stroke="#2B353E" stroke-width="2"/>
  <!-- Main head -->
  <polygon points="50,8 90,30 82,70 50,92 18,70 10,30" fill="url(#head)" stroke="#2B353E" stroke-width="2"/>
  <!-- Snout -->
  <polygon points="36,50 64,50 58,78 50,86 42,78" fill="#CFD3D6" stroke="#2B353E" stroke-width="1.5"/>
  <!-- Nose -->
  <polygon points="46,56 54,56 50,64" fill="#4C5C6F" stroke="#2B353E" stroke-width="1"/>
</svg>
